name: Build Customer (Production)

on:
  push:
    branches:
      - main
    paths:
      - apps/customer/**

jobs:
  build_android:
    name: Build Android
    type: build
    params:
      platform: android
      profile: production
  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production
