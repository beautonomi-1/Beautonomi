name: Publish Customer Production OTA

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  update_ios:
    name: Production OTA (iOS)
    type: update
    environment: production
    env:
      APP_ENV: production
      CI: "1"
      EXPO_NO_DOTENV: "1"
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      SENTRY_ALLOW_FAILURE: "true"
    hooks:
      after_install_node_modules:
        - name: Ensure babel-preset-expo resolves for Metro (monorepo)
          run: pnpm install --filter customer... --prefer-offline
        - name: Verify Babel JSX plugin for Metro workers
          run: |
            if [ -f tooling/expo/assert-babel-jsx-plugin.cjs ]; then
              node tooling/expo/assert-babel-jsx-plugin.cjs
            else
              node ../../tooling/expo/assert-babel-jsx-plugin.cjs
            fi
    params:
      channel: production
      platform: ios
      message: Customer production OTA (iOS)
      upload_sentry_sourcemaps: false
  update_android:
    name: Production OTA (Android)
    type: update
    environment: production
    env:
      APP_ENV: production
      CI: "1"
      EXPO_NO_DOTENV: "1"
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      SENTRY_ALLOW_FAILURE: "true"
    hooks:
      after_install_node_modules:
        - name: Ensure babel-preset-expo resolves for Metro (monorepo)
          run: pnpm install --filter customer... --prefer-offline
        - name: Verify Babel JSX plugin for Metro workers
          run: |
            if [ -f tooling/expo/assert-babel-jsx-plugin.cjs ]; then
              node tooling/expo/assert-babel-jsx-plugin.cjs
            else
              node ../../tooling/expo/assert-babel-jsx-plugin.cjs
            fi
    params:
      channel: production
      platform: android
      message: Customer production OTA (Android)
      upload_sentry_sourcemaps: false
