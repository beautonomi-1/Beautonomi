name: Publish Customer Production OTA

# Manual only. Auto-OTA on every main push is not a CI gate — store binaries
# come from Build Customer (Production). Publish JS updates on purpose via
# Expo dashboard "Run" or `pnpm --filter customer update:production`.
on:
  workflow_dispatch:

jobs:
  update_ios:
    name: Production OTA (iOS)
    type: update
    environment: production
    env:
      APP_ENV: production
      EXPO_NO_DOTENV: "1"
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      SENTRY_ALLOW_FAILURE: "true"
    hooks:
      after_install_node_modules:
        - name: Ensure babel-preset-expo resolves for Metro (monorepo)
          run: pnpm install --filter customer... --prefer-offline
    params:
      channel: production
      platform: ios
      message: Customer production OTA (iOS)
      upload_sentry_sourcemaps: false
  update_android:
    name: Production OTA (Android)
    type: update
    environment: production
    env:
      APP_ENV: production
      EXPO_NO_DOTENV: "1"
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      SENTRY_ALLOW_FAILURE: "true"
    hooks:
      after_install_node_modules:
        - name: Ensure babel-preset-expo resolves for Metro (monorepo)
          run: pnpm install --filter customer... --prefer-offline
    params:
      channel: production
      platform: android
      message: Customer production OTA (Android)
      upload_sentry_sourcemaps: false
