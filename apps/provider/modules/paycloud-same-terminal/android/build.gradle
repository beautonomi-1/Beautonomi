apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

group = "expo.modules.paycloudsameterminal"
version = "1.0.0"

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

apply from: project(":expo-modules-core").file("ExpoModulesCorePlugin.gradle")
applyKotlinExpoModulesCorePlugin()

android {
  namespace "expo.modules.paycloudsameterminal"
  compileSdk safeExtGet("compileSdkVersion", 36)

  defaultConfig {
    minSdk safeExtGet("minSdkVersion", 24)
    targetSdk safeExtGet("targetSdkVersion", 36)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation project(":expo-modules-core")
}
