name: Publish Provider Production OTA

# Manual only. Auto-OTA on every main push is not a CI gate — store binaries
# come from Build Provider (Production). Publish JS updates on purpose via
# Expo dashboard "Run" or `pnpm --filter provider update:production`.
on:
  workflow_dispatch:

jobs:
  update_ios:
    name: Production OTA (iOS)
    type: update
    environment: production
    hooks:
      after_install_node_modules:
        - name: Ensure babel-preset-expo resolves for Metro (monorepo)
          run: pnpm install --filter provider... --prefer-offline
    params:
      channel: production
      platform: ios
      message: Provider production OTA (iOS)
  update_android:
    name: Production OTA (Android)
    type: update
    environment: production
    hooks:
      after_install_node_modules:
        - name: Ensure babel-preset-expo resolves for Metro (monorepo)
          run: pnpm install --filter provider... --prefer-offline
    params:
      channel: production
      platform: android
      message: Provider production OTA (Android)
