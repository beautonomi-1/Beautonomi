name: Publish Provider Production OTA

on:
  push:
    branches:
      - main
    paths:
      - apps/provider/**
      - packages/i18n/**
      - package.json
      - pnpm-lock.yaml

jobs:
  update_ios:
    name: Production OTA (iOS)
    type: update
    environment: production
    hooks:
      after_install_node_modules:
        - name: Ensure babel-preset-expo resolves for Metro (monorepo)
          run: pnpm install --filter provider... --prefer-offline
    params:
      channel: production
      platform: ios
      message: Provider production OTA (build 286 / fingerprint runtime)
  update_android:
    name: Production OTA (Android)
    type: update
    environment: production
    hooks:
      after_install_node_modules:
        - name: Ensure babel-preset-expo resolves for Metro (monorepo)
          run: pnpm install --filter provider... --prefer-offline
    params:
      channel: production
      platform: android
      message: Provider production OTA (build 286 / fingerprint runtime)
