<!DOCTYPE html>
<html>
  <body style="font-family: system-ui, sans-serif; line-height: 1.5; color: #111">
    <h1 style="font-size: 20px">Confirm your Beautonomi account</h1>
    <p>Enter this verification code on the signup screen to finish creating your account:</p>
    <p style="font-size: 28px; font-weight: 700; letter-spacing: 0.2em">{{ .Token }}</p>
    <p style="font-size: 13px; color: #555">
      This code expires soon. If you did not start a Beautonomi signup, you can ignore this email.
    </p>
    <!-- Optional: keep a link for users who prefer it. The /auth/callback handler verifies
         token_hash + type=signup so this still works as a fallback. -->
    <p style="font-size: 13px; color: #555">
      Or <a href="{{ .ConfirmationURL }}">confirm via this link</a> on the same device.
    </p>
  </body>
</html>
