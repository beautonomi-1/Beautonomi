<!DOCTYPE html>
<html>
  <body style="font-family: system-ui, sans-serif; line-height: 1.5; color: #111">
    <h1 style="font-size: 20px">Sign in to Beautonomi</h1>
    <p>Use this one-time code in the app or website:</p>
    <p style="font-size: 28px; font-weight: 700; letter-spacing: 0.2em">{{ .Token }}</p>
    <p style="font-size: 13px; color: #555">
      This code expires soon. If you did not request it, you can ignore this email.
    </p>
    <!-- Optional: keep a link for users who prefer it (still works with Supabase) -->
    <p style="font-size: 13px; color: #555">
      Or <a href="{{ .ConfirmationURL }}">open this sign-in link</a> on the same device.
    </p>
  </body>
</html>
