<!doctype html>
<html>
  <body style="margin:0;background:#f8fafc;color:#111827;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;line-height:1.5;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f8fafc;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:640px;background:#ffffff;border:1px solid #e5e7eb;border-radius:24px;overflow:hidden;">
            <tr>
              <td style="background:#111827;padding:32px 32px 28px;">
                <p style="margin:0 0 10px;color:#f9a8d4;font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;">Beautonomi</p>
                <h1 style="margin:0;color:#ffffff;font-size:28px;line-height:1.15;font-weight:700;">Confirm your new email</h1>
                <p style="margin:10px 0 0;color:#cbd5e1;font-size:15px;">Enter this code in the provider onboarding step.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:28px 32px;text-align:center;">
                <p style="margin:0 0 8px;color:#6b7280;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;">Verification code</p>
                <p style="margin:0;color:#111827;font-size:32px;font-weight:800;letter-spacing:0.25em;">{{ .Token }}</p>
                <p style="margin:20px 0 0;color:#475569;font-size:13px;line-height:1.6;">If you did not request this change, contact support.</p>
                <p style="margin:16px 0 0;color:#475569;font-size:13px;">Or <a href="{{ .ConfirmationURL }}" style="color:#FF0077;font-weight:600;">confirm with this link</a>.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:18px 32px;background:#fdf2f8;color:#9d174d;font-size:12px;text-align:center;">
                Beautonomi account security message — do not share this code.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
