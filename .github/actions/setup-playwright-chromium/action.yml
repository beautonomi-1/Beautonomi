name: Setup Playwright Chromium
description: Restore cached Chromium or download on cache miss (no apt --with-deps; ubuntu-latest already has browser libs).

inputs:
  package-filter:
    description: pnpm package filter (e.g. admin-web, web)
    required: true

runs:
  using: composite
  steps:
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install Playwright Chromium
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm --filter ${{ inputs.package-filter }} exec playwright install chromium
