name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Faster, deterministic Turbo in CI; less noise; Next telemetry off in automated runs.
env:
  TURBO_DAEMON: "false"
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  CI: "true"

jobs:
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tooling/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}

  typecheck:
    name: TypeScript Check
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tooling/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Typecheck (turbo)
        run: pnpm exec turbo run typecheck --filter="./packages/*" --filter=web --filter=admin-web --filter=customer --filter=provider

      - name: Admin regression (Vitest + API taxonomy)
        run: |
          pnpm --filter admin-web test
          node apps/admin-web/scripts/check-admin-api-routes-in-taxonomy.mjs

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tooling/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Lint (turbo)
        run: pnpm exec turbo run lint --filter=web --filter=admin-web --filter=customer --filter=provider

  build-web:
    name: Build Web App
    needs: [typecheck, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-key' }}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      VITE_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-key' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tooling/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Restore Turbo & Next.js compile cache
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            apps/web/.next/cache
          key: ${{ runner.os }}-web-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'apps/web/package.json', 'apps/web/next.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-web-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
            ${{ runner.os }}-web-

      - name: Build admin SPA (artifacts copied into web via next-build)
        run: pnpm exec turbo run build --filter=admin-web

      - name: Setup Playwright Chromium for admin E2E
        uses: ./.github/actions/setup-playwright-chromium
        with:
          package-filter: admin-web

      - name: Admin SPA E2E smoke (login shell, auth redirect)
        working-directory: apps/admin-web
        run: pnpm exec playwright test
        env:
          CI: true

      - name: Build web (turbo)
        run: pnpm exec turbo run build --filter=web

      - name: Check bundle size budget
        run: pnpm --filter web check-bundle

  build-mobile:
    name: Build Mobile Apps (Typecheck)
    needs: [typecheck, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-key' }}
      EXPO_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tooling/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Build packages (turbo)
        run: pnpm exec turbo run build --filter="./packages/*"

      # Validates app.json / plugins / env (no EAS binary export in this repo)
      - name: Validate Expo config (customer)
        run: pnpm --filter customer exec expo config --type public

      - name: Validate Expo config (provider)
        run: pnpm --filter provider exec expo config --type public

  security:
    name: Dependency Audit
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tooling/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}

      # pnpm audit uses retired npm audit endpoints (410); use npm audit via lockfile until pnpm v11+ supports bulk API (pnpm#11265)
      - name: Audit dependencies (high + critical)
        run: pnpm run audit:deps

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  migration-hygiene:
    name: Migration Hygiene
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tooling/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Migration prefix + drift check
        run: node tooling/audit/check-migrations.mjs

  test:
    name: Test
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tooling/*/node_modules
          key: modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Run multi-tenant audits (strict tenant hints)
        run: pnpm audit:multi-tenant:strict

      - name: Run tests
        run: pnpm test
