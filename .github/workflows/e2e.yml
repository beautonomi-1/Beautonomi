name: E2E (Preview + Staging)

on:
  deployment_status:

jobs:
  staging-e2e:
    # Run against successful Vercel Preview deployments (skippable — no seed) AND
    # against Staging deployments (non-skippable — always seeds a test provider).
    if: >-
      github.event.deployment_status.state == 'success' &&
      (
        github.event.deployment_status.environment == 'Preview' ||
        github.event.deployment_status.environment == 'Staging' ||
        github.event.deployment_status.environment == 'staging'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IS_STAGING: ${{ contains(github.event.deployment_status.environment, 'taging') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile

      # Seed the staging test provider (only for Staging environment).
      # Outputs E2E_PROVIDER_SLUG which overrides the secret on staging runs.
      - name: Seed staging provider (Staging only)
        if: ${{ env.IS_STAGING == 'true' }}
        id: seed
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Seed is idempotent (upserts). Capture stdout (slug) in one run.
          SLUG=$(node scripts/e2e/seed-staging.mjs)
          echo "provider_slug=${SLUG}" >> "$GITHUB_OUTPUT"

      - name: Resolve provider slug
        id: slug
        run: |
          # Use seeded slug on staging; fall back to repo secret on preview.
          SLUG="${{ steps.seed.outputs.provider_slug }}"
          if [ -z "$SLUG" ]; then
            SLUG="${{ secrets.E2E_PROVIDER_SLUG }}"
          fi
          echo "value=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Setup Playwright Chromium
        uses: ./.github/actions/setup-playwright-chromium
        with:
          package-filter: web

      - name: Run booking + money-path E2E
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.environment_url }}
          E2E_PROVIDER_SLUG: ${{ steps.slug.outputs.value }}
          # On staging, the test is non-skippable (slug is always set by seed step).
          E2E_NON_SKIPPABLE: ${{ env.IS_STAGING }}
        run: pnpm exec playwright test e2e/booking-happy-path.spec.ts e2e/money-path.spec.ts

      # REM-007 — multi-market tenant isolation (staging only).
      # Requires GitHub secrets:
      #   E2E_TENANT_B_BASE — foreign market host (e.g. https://www.beautonomi.com)
      # Optional overrides:
      #   E2E_TENANT_A_BASE — defaults to the staging deployment URL
      #   E2E_TENANT_A_PROVIDER — defaults to the seeded staging provider slug
      - name: Run tenant isolation E2E (Staging only)
        if: ${{ env.IS_STAGING == 'true' }}
        working-directory: apps/web
        env:
          E2E_TENANT_A_BASE: ${{ secrets.E2E_TENANT_A_BASE || github.event.deployment_status.environment_url }}
          E2E_TENANT_B_BASE: ${{ secrets.E2E_TENANT_B_BASE }}
          E2E_TENANT_A_PROVIDER: ${{ steps.slug.outputs.value || secrets.E2E_TENANT_A_PROVIDER }}
          E2E_NON_SKIPPABLE: "true"
        run: pnpm exec playwright test e2e/tenant-isolation.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: apps/web/playwright-report
          retention-days: 14
