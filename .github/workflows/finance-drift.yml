name: Finance Ledger Drift Check (Nightly)

on:
  schedule:
    # Runs at 02:00 UTC every day
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      supabase_url_override:
        description: "Optional Supabase URL override (leave blank to use secret)"
        required: false
        default: ""

# Default GITHUB_TOKEN cannot open issues unless explicitly granted.
permissions:
  contents: read
  issues: write

jobs:
  finance-audit:
    name: Finance Ledger Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install @supabase/supabase-js
        run: npm install --no-save @supabase/supabase-js

      - name: Run finance ledger audit
        id: audit
        env:
          SUPABASE_URL: ${{ github.event.inputs.supabase_url_override || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/prod/audit-finance-ledger.mjs

      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const title = `🚨 Finance Ledger Drift Detected — ${new Date().toISOString().split('T')[0]}`;
            const body = [
              '**Finance ledger audit failed.** Ledger invariants are violated in production.',
              '',
              '**Run details:**',
              `- Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Triggered: ${context.eventName}`,
              '',
              '**Immediate actions:**',
              '1. Review the audit output in the failed job logs above.',
              '2. Identify the affected `finance_transactions` / `booking_refunds` rows.',
              '3. Follow the runbook in `docs/MANUAL_FINANCE_VALIDATION.md`.',
              '4. Assign a Payments lead to remediate and sign off.',
            ].join('\n');

            await core.summary.addHeading(title, 2).addRaw(body).write();

            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['finance', 'alert', 'p1'],
              });
              core.info('Opened tracking issue for finance ledger drift.');
            } catch (err) {
              core.warning(
                `Could not open GitHub issue (check workflow permissions or label existence): ${err?.message ?? err}`,
              );
            }
