# Release workflow: binaries via goreleaser, Docker image via separate job.
# Runs only on tags matching v*.*.* (e.g. v1.0.0).
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Binary release (Goreleaser)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-myapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Go mod tidy
        run: go mod tidy

      # Goreleaser runs strictly from .goreleaser.yaml (binary-only; no Docker).
      - name: Run Goreleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          version: latest
          config: .goreleaser.yaml
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: go-myapp
          file: go-myapp/Dockerfile
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/myapp:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/myapp:latest
