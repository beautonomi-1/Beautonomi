title = "Beautonomi gitleaks configuration"

# Extend the bundled default ruleset so new common leak detectors kick in automatically.
[extend]
useDefault = true

[[rules]]
id = "paystack-secret-key"
description = "Paystack secret key (sk_live_/sk_test_)"
regex = '''sk_(live|test)_[a-f0-9]{40}'''
tags = ["key", "paystack"]

[[rules]]
id = "paystack-public-key"
description = "Paystack public key (pk_live_/pk_test_)"
regex = '''pk_(live|test)_[a-f0-9]{40}'''
tags = ["key", "paystack"]

[[rules]]
id = "yoco-secret-key"
description = "Yoco secret key"
regex = '''sk_(live|test)_[A-Za-z0-9]{20,}'''
tags = ["key", "yoco"]

[[rules]]
id = "supabase-service-role-jwt"
description = "Supabase service-role JWT"
regex = '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.[A-Za-z0-9_\-]{20,}\.[A-Za-z0-9_\-]{20,}'''
tags = ["jwt", "supabase"]

# Allow-list for migration placeholders. Placeholder keys end in `_placeholder` and are
# intentionally committed as examples in docs; they must never match a real Paystack key format.
# The Apple JWS fixture is a throwaway test CA (scripts/generate-apple-jws-test-chain.mjs)
# that authenticates nothing; gitleaks flags the PEM armor of the leaf key.
# The all-zero Mailchimp Marketing key is a shape-only fixture used in unit tests
# (32 hex + datacenter suffix). It authenticates nothing. The sequential hex
# variant was an earlier fixture that gitleaks flagged as generic-api-key.
[allowlist]
description = "Documentation / example placeholders / throwaway test fixtures"
paths = [
  '''docs/audits/.*\.md''',
  '''docs/PLAYBOOKS/.*\.md''',
  '''.*\.example''',
  '''CHANGELOG\.md''',
  '''apps/web/src/lib/iap/apple/__tests__/fixtures/test-chain\.ts''',
]
regexes = [
  '''sk_test_placeholder[a-z0-9]*''',
  '''pk_test_placeholder[a-z0-9]*''',
  '''00000000000000000000000000000000-us0''',
  '''a1b2c3d4e5f6789012345678abcdef01-xx1''',
]
